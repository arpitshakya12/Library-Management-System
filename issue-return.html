
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Issue & Return Books | LibraFlow</title>
    <link rel="stylesheet" href="css/issue-return.css">

    <script>
        if (localStorage.getItem("loggedIn") !== "true") {
            window.location.href = "login.html";
        }
    </script>
    <link rel="stylesheet" href="css/polish.css">
    <link rel="stylesheet" href="css/professional.css">
</head>
<body>

<div class="container">

    <header class="header">
        <div>
            <h1>Issue & Return Books</h1>
            <p>Manage book borrowing and returning records</p>
        </div>
        <a href="index.html" class="back-btn">← Dashboard</a>
    </header>

    <!-- Statistics -->
    <section class="stats">
        <div class="stat-card">
            <h3>Total Issued</h3>
            <p id="totalIssued">0</p>
        </div>

        <div class="stat-card">
            <h3>Returned Books</h3>
            <p id="totalReturned">0</p>
        </div>

        <div class="stat-card">
            <h3>Overdue Books</h3>
            <p id="totalOverdue">0</p>
        </div>

        <div class="stat-card">
            <h3>Total Fine</h3>
            <p id="totalFine">₹0</p>
        </div>
    </section>

    <!-- Issue Book Form -->
    <section class="card" id="issue">
        <h2>Issue a Book</h2>

        <form id="issueForm">
            <div class="form-grid">

                <div class="form-group">
                    <label>Select Student</label>
                    <select id="issueStudent" required>
                        <option value="">Select Student</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Select Book</label>
                    <select id="issueBook" required>
                        <option value="">Select Book</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Issue Date</label>
                    <input type="date" id="issueDate" required>
                </div>

                <div class="form-group">
                    <label>Due Date</label>
                    <input type="date" id="dueDate" required>
                </div>

            </div>

            <button type="submit" class="primary-btn">
                Issue Book
            </button>
        </form>
    </section>

    <!-- Transaction Records -->
    <section class="card" id="records">
        <div class="records-header">
            <h2>Book Transactions</h2>

            <div class="filters">
                <input type="search" id="searchRecords"
                    placeholder="Search student or book...">

                <select id="statusFilter">
                    <option value="">All Records</option>
                    <option value="Issued">Issued</option>
                    <option value="Returned">Returned</option>
                </select>
            </div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Student</th>
                        <th>Book</th>
                        <th>Issue Date</th>
                        <th>Due Date</th>
                        <th>Return Date</th>
                        <th>Fine</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="transactionTable">
                    <tr>
                        <td colspan="8" class="empty">
                            No transactions found.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

</div>

<script src="js/demo-data.js"></script>
    <script src="js/issue-return.js"></script>
</body>
</html>
